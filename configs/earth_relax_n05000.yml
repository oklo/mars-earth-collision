# Fixed-entropy body relaxation for SWIFT planetary SPH.
InternalUnitSystem:
    UnitMass_in_cgs:        1e27
    UnitLength_in_cgs:      1e8
    UnitVelocity_in_cgs:    1e8
    UnitCurrent_in_cgs:     1
    UnitTemp_in_cgs:        1

InitialConditions:
    file_name:  earth_unrelaxed_n05000.hdf5
    periodic:   0

TimeIntegration:
    time_begin:     0
    time_end:       20000
    dt_min:         0.000001
    dt_max:         1000

Snapshots:
    subdir:             snapshots_relax_earth
    basename:           earth_relax_n05000
    time_first:         0
    delta_time:         5000

Statistics:
    time_first: 0
    delta_time: 1000

Restarts:
    enable: 0

SPH:
    resolution_eta:     1.2348
    delta_neighbours:   0.1
    CFL_condition:      0.2
    h_max:              1.5
    viscosity_alpha:    1.5

Gravity:
    eta:                            0.025
    MAC:                            adaptive
    epsilon_fmm:                    0.001
    theta_cr:                       0.5
    max_physical_baryon_softening:  0.16

EoS:
    planetary_use_ANEOS_forsterite:   1
    planetary_use_ANEOS_Fe85Si15:     1
    planetary_ANEOS_forsterite_table_file:  /Users/greglaughlin/Projects/earth-mars-swift/swift/examples/Planetary/EoSTables/ANEOS_forsterite_S19.txt
    planetary_ANEOS_Fe85Si15_table_file:    /Users/greglaughlin/Projects/earth-mars-swift/swift/examples/Planetary/EoSTables/ANEOS_Fe85Si15_S20.txt
