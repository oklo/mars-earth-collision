# Hero entropy-evolving continuation of the settled n200000 impact, 72h to 92h.
# Snapshot cadence: 30 s to 76h, 60 s to 80h, then 120 s to 92h.
InternalUnitSystem:
    UnitMass_in_cgs:        1e27
    UnitLength_in_cgs:      1e8
    UnitVelocity_in_cgs:    1e8
    UnitCurrent_in_cgs:     1
    UnitTemp_in_cgs:        1

InitialConditions:
    file_name:  mars_earth_grazing_settled_n200000_72h_to_92h_ic.hdf5
    periodic:   0

TimeIntegration:
    time_begin:     259200
    time_end:       331200
    dt_min:         0.000001
    dt_max:         30

Snapshots:
    subdir:             snapshots_settled_n200000_72h_to_92h
    basename:           mars_earth_grazing_settled_n200000_72h_to_92h
    time_first:         259200
    delta_time:         120
    output_list_on:     1
    output_list:        mars_earth_grazing_settled_n200000_72h_to_92h_output_times.txt

Statistics:
    time_first: 259200
    delta_time: 60

Restarts:
    enable:         1
    save:           1
    onexit:         1
    subdir:         restart_settled_n200000_72h_to_92h
    basename:       mars_earth_grazing_settled_n200000_72h_to_92h
    delta_hours:    4.0
    stop_steps:     100
    max_run_time:   240.0

SPH:
    resolution_eta:     1.2348
    delta_neighbours:   0.1
    CFL_condition:      0.2
    h_max:              2.0
    viscosity_alpha:    1.5

Gravity:
    eta:                            0.025
    MAC:                            adaptive
    epsilon_fmm:                    0.001
    theta_cr:                       0.5
    max_physical_baryon_softening:  0.25

EoS:
    planetary_use_ANEOS_forsterite:   1
    planetary_use_ANEOS_Fe85Si15:     1
    planetary_ANEOS_forsterite_table_file:  /Users/greglaughlin/Projects/earth-mars-swift/swift/examples/Planetary/EoSTables/ANEOS_forsterite_S19.txt
    planetary_ANEOS_Fe85Si15_table_file:    /Users/greglaughlin/Projects/earth-mars-swift/swift/examples/Planetary/EoSTables/ANEOS_Fe85Si15_S20.txt
